version: '3.8'

services:
  # ── Local Postgres Database (Supabase compatible) ──────────────────────────
  database:
    image: postgres:15-alpine
    container_name: fullstack_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "54332:5432" # Maps standard container port 5432 to our offset 54332
    volumes:
      - fullstack_db_data:/var/lib/postgresql/data
    networks:
      - fullstack_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fullstack_api
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    env_file:
      - apps/api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fullstack_network
    command: pnpm run dev
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fullstack_web
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    # Web gets ONLY its own public VITE_* values — never the API's secrets.
    env_file:
      - apps/web/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fullstack_network
    command: pnpm run dev
    depends_on:
      - api

networks:
  fullstack_network:
    driver: bridge

volumes:
  fullstack_db_data:
