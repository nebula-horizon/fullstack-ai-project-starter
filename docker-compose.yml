# Optional: run the API and web app in containers. The database is NOT here —
# start the Supabase CLI stack first (`mise run db:start`); it is the only local
# Postgres, on the same major version as hosted Supabase. The containers reach it
# through host.docker.internal.
#
# Most day-to-day work uses `mise run dev` instead; see docs/workflows/local-setup.md.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fullstack_api
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    env_file:
      - apps/api/.env
    environment:
      # Inside the container, 127.0.0.1 is the container itself, so point at the host.
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54332/postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fullstack_network
    command: pnpm run dev

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fullstack_web
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    # Web gets only its own browser-safe values — never the API's secrets.
    env_file:
      - apps/web/.env
    environment:
      # The dev proxy forwards /api to the api service on the compose network.
      API_URL: http://api:3333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fullstack_network
    command: pnpm run dev
    depends_on:
      - api

networks:
  fullstack_network:
    driver: bridge
