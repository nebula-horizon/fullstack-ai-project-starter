[env]
NODE_ENV = "development"

[tools]
node = "22.22.3"  # same as the Dockerfiles' base image
pnpm = "9.15.9"   # same as package.json "packageManager"
biome = "2.5.15"  # same as @biomejs/biome in pnpm-lock.yaml
# Every tool is pinned; CI pins the same versions.
supabase = "2.113.0"
opentofu = "1.10.10"
"npm:@fission-ai/openspec" = "1.3.1"
docker-compose = "5.6.0"

[task_config]
includes = [
  ".mise/tasks.toml",
  "apps/web/.mise/tasks.toml",
  "apps/api/.mise/tasks.toml",
]
